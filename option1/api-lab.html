<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Lab — Pentesting & Linux</title>
<style>
  :root {
    --bg: #0a0e14;
    --bg-elev: #0f1419;
    --bg-card: #131820;
    --border: #1f2933;
    --text: #c5d1de;
    --text-dim: #6b7785;
    --accent: #00ff9d;
    --accent-dim: #00cc7e;
    --warn: #ffb454;
    --crit: #ff4d6d;
    --info: #4d9fff;
    --ok: #00ff9d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    border-bottom: 1px solid var(--border);
    background: var(--bg-elev);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  header h1 {
    font-size: 18px;
    color: var(--accent);
    font-weight: 600;
  }
  header h1 .blink { animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .status-pill {
    font-size: 11px;
    padding: 4px 10px;
    background: var(--bg-card);
    border: 1px solid var(--accent);
    border-radius: 12px;
    color: var(--accent);
  }
  .status-pill.off { border-color: var(--text-dim); color: var(--text-dim); }

  /* LAYOUT */
  .app {
    display: grid;
    grid-template-columns: 280px 1fr;
    height: calc(100vh - 60px);
  }
  .sidebar {
    background: var(--bg-elev);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px;
  }
  .main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* SIDEBAR */
  .nav-section {
    margin-bottom: 24px;
  }
  .nav-section h3 {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    padding-left: 8px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
    transition: all .15s;
    border-left: 2px solid transparent;
  }
  .nav-item:hover { background: var(--bg-card); }
  .nav-item.active {
    background: var(--bg-card);
    border-left-color: var(--accent);
    color: var(--accent);
  }
  .nav-item .ico { margin-right: 8px; width: 18px; }

  /* DB PANEL */
  .db-panel {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .db-stats {
    background: var(--bg-card);
    border-radius: 6px;
    padding: 12px;
    margin-top: 8px;
  }
  .db-row {
    display: flex; justify-content: space-between;
    font-size: 12px; padding: 4px 0;
  }
  .db-row span:last-child { color: var(--accent); }
  .db-empty { color: var(--text-dim); font-size: 11px; font-style: italic; }

  /* CONSOLE */
  .console {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #050709;
    border-bottom: 1px solid var(--border);
  }
  .console-bar {
    display: flex;
    align-items: center;
    background: var(--bg-elev);
    padding: 6px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .console-bar .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); margin-right: 8px;
  }
  .console-output {
    flex: 1;
    padding: 12px 16px;
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.6;
  }
  .console-line { margin-bottom: 4px; }
  .console-line.req { color: var(--info); }
  .console-line.res { color: var(--accent); }
  .console-line.err { color: var(--crit); }
  .console-line.info { color: var(--text-dim); }
  .console-line .verb { font-weight: bold; }
  .console-line .status { color: var(--ok); }
  .console-line .status.err { color: var(--crit); }
  .console-input {
    display: flex;
    border-top: 1px solid var(--border);
    background: var(--bg-elev);
  }
  .console-input .prompt {
    padding: 12px 12px 12px 16px;
    color: var(--accent);
    font-size: 13px;
  }
  .console-input input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 12px 16px 12px 0;
  }
  .console-input input::placeholder { color: var(--text-dim); }

  /* CONTENT */
  .content {
    height: 320px;
    overflow-y: auto;
    padding: 16px 24px;
    background: var(--bg);
  }
  .content h2 {
    font-size: 14px;
    color: var(--accent);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .content p {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .quick-cmds {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 6px;
  }
  .quick-cmd {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 8px 10px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    color: var(--text);
    transition: all .15s;
    font-family: inherit;
    text-align: left;
  }
  .quick-cmd:hover {
    border-color: var(--accent);
    background: rgba(0,255,157,0.05);
  }
  .quick-cmd .verb {
    color: var(--info);
    font-weight: bold;
    margin-right: 6px;
  }

  /* ENDPOINTS */
  .endpoints {
    display: grid;
    gap: 6px;
    margin-top: 12px;
  }
  .endpoint {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 12px;
    font-size: 12px;
  }
  .endpoint .verb { color: var(--info); font-weight: bold; }
  .endpoint .path { color: var(--accent); margin-left: 6px; }
  .endpoint .desc { color: var(--text-dim); margin-left: 12px; font-size: 11px; }

  .empty {
    color: var(--text-dim);
    font-size: 12px;
    font-style: italic;
    padding: 8px 0;
  }

  /* TABS */
  .tabs {
    display: flex;
    background: var(--bg-elev);
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 10px 16px;
    font-size: 12px;
    cursor: pointer;
    color: var(--text-dim);
    border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:hover { color: var(--text); }

  /* MODAL */
  .modal {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: center; justify-content: center;
  }
  .modal.show { display: flex; }
  .modal-content {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    max-width: 600px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal-content h2 { color: var(--accent); margin-bottom: 12px; }
  .modal-content pre {
    background: var(--bg);
    padding: 12px;
    border-radius: 4px;
    overflow-x: auto;
    font-size: 12px;
    color: var(--text);
  }
  .modal-content .close {
    float: right; cursor: pointer; color: var(--text-dim);
    font-size: 20px; line-height: 1;
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-elev); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
</style>
</head>
<body>

<header>
  <h1>⚡ API Lab<span class="blink">_</span></h1>
  <div class="status-pill" id="statusPill">● MOCK SERVER ACTIVE</div>
</header>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="nav-section">
      <h3>Secciones</h3>
      <div class="nav-item active" data-view="home"><span class="ico">🏠</span>Inicio</div>
      <div class="nav-item" data-view="endpoints"><span class="ico">🔌</span>Endpoints</div>
      <div class="nav-item" data-view="help"><span class="ico">📖</span>Ayuda</div>
    </div>

    <div class="nav-section">
      <h3>Datasets cargados</h3>
      <div class="db-panel">
        <div class="db-stats" id="dbStats">
          <div class="db-empty">// DB vacía — cargá datos vía API</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="tabs">
      <div class="tab active" data-tab="content">Vista</div>
      <div class="tab" data-tab="console">Consola API</div>
    </div>

    <section class="content" id="view">
      <!-- dinámico -->
    </section>

    <section class="console">
      <div class="console-bar">
        <div class="dot"></div>
        <span>API Console — escribí un comando HTTP o usá los quick-actions</span>
      </div>
      <div class="console-output" id="output">
        <div class="console-line info">// Lab inicializado. DB vacía. Probá: <b>help</b></div>
      </div>
      <div class="console-input">
        <span class="prompt">$&gt;</span>
        <input type="text" id="cmd" placeholder="GET /api/v1/datasets" autofocus>
      </div>
    </section>
  </main>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">×</span>
    <div id="modalBody"></div>
  </div>
</div>

/* ============================================================
   MOCK API SERVER (en memoria)
   ============================================================ */
const DB = {
  loaded: {},  // { datasetKey: { meta, categories, shells, ... } }
  queries: []  // log
};

const MOCK_API = {
  // GET /api/v1/datasets
  'GET /api/v1/datasets': () => ({
    status: 200,
    data: {
      available: Object.keys(DATASETS),
      loaded: Object.keys(DB.loaded),
      count: Object.keys(DATASETS).length
    }
  }),

  // GET /api/v1/datasets/:name
  'GET /api/v1/datasets/': (params, query) => {
    const name = params[0];
    if (!name) return { status: 400, data: { error: "Falta nombre del dataset" } };
    if (!DATASETS[name]) return { status: 404, data: { error: `Dataset '${name}' no existe` } };
    if (DB.loaded[name]) {
      return { status: 200, data: { source: "db", ...DB.loaded[name] } };
    }
    return { status: 200, data: { source: "remote", preview: { name: DATASETS[name].name, description: DATASETS[name].description, categories: Object.keys(DATASETS[name].categories) } } };
  },

  // POST /api/v1/datasets/:name/load  — carga dataset en DB
  'POST /api/v1/datasets/': (params, query) => {
    const name = params[0];
    const action = params[1];
    if (!name) return { status: 400, data: { error: "Falta nombre" } };
    if (action === "load") {
      if (!DATASETS[name]) return { status: 404, data: { error: "Dataset no existe" } };
      DB.loaded[name] = JSON.parse(JSON.stringify(DATASETS[name]));
      DB.loaded[name].loaded_at = new Date().toISOString();
      return { status: 201, data: { msg: `Dataset '${name}' cargado en DB`, total_commands: Object.values(DATASETS[name].categories).reduce((s,c)=>s+c.commands.length,0) } };
    }
    return { status: 400, data: { error: "Acción no reconocida" } };
  },

  // GET /api/v1/commands?cat=suid&q=find
  'GET /api/v1/commands': (params, query) => {
    const loadedKeys = Object.keys(DB.loaded);
    if (loadedKeys.length === 0) {
      return { status: 503, data: { error: "DB vacía. Cargá un dataset primero: POST /api/v1/datasets/privesc/load" } };
    }
    let results = [];
    loadedKeys.forEach(k => {
      const ds = DB.loaded[k];
      Object.entries(ds.categories || {}).forEach(([catKey, cat]) => {
        (cat.commands || []).forEach(c => {
          results.push({ dataset: k, category: catKey, severity: cat.severity, ...c });
        });
      });
    });
    if (query.cat) results = results.filter(r => r.category === query.cat);
    if (query.q) {
      const q = query.q.toLowerCase();
      results = results.filter(r => r.cmd.toLowerCase().includes(q) || r.desc.toLowerCase().includes(q));
    }
    if (query.severity) results = results.filter(r => r.severity === query.severity);
    return { status: 200, data: { count: results.length, results: results.slice(0, 50) } };
  },

  // GET /api/v1/shells
  'GET /api/v1/shells': (params, query) => {
    const loadedKeys = Object.keys(DB.loaded);
    const shells = {};
    loadedKeys.forEach(k => {
      if (DB.loaded[k].shells) Object.assign(shells, DB.loaded[k].shells);
    });
    if (Object.keys(shells).length === 0) {
      return { status: 503, data: { error: "Sin shells cargados. Cargá privesc dataset." } };
    }
    return { status: 200, data: { count: Object.keys(shells).length, shells } };
  },

  // GET /api/v1/db
  'GET /api/v1/db': () => ({
    status: 200,
    data: {
      loaded_datasets: Object.keys(DB.loaded),
      total_commands: Object.values(DB.loaded).reduce((s,ds) => s + Object.values(ds.categories||{}).reduce((a,c)=>a+(c.commands||[]).length,0), 0),
      total_categories: Object.values(DB.loaded).reduce((s,ds)=>s+Object.keys(ds.categories||{}).length,0),
      queries_count: DB.queries.length
    }
  }),

  // DELETE /api/v1/db
  'DELETE /api/v1/db': () => {
    const prev = Object.keys(DB.loaded).length;
    DB.loaded = {};
    return { status: 200, data: { msg: `DB vaciada. ${prev} datasets eliminados.` } };
  },

  // GET /api/v1/help
  'GET /api/v1/help': () => ({
    status: 200,
    data: {
      endpoints: [
        { method: "GET",    path: "/api/v1/datasets",              desc: "Lista datasets disponibles y cargados" },
        { method: "GET",    path: "/api/v1/datasets/:name",         desc: "Preview o contenido de un dataset" },
        { method: "POST",   path: "/api/v1/datasets/:name/load",    desc: "Carga un dataset en la DB" },
        { method: "GET",    path: "/api/v1/commands",               desc: "Busca comandos en la DB (?cat= ?q= ?severity=)" },
        { method: "GET",    path: "/api/v1/shells",                 desc: "Lista reverse shells" },
        { method: "GET",    path: "/api/v1/db",                     desc: "Estado de la DB" },
        { method: "DELETE", path: "/api/v1/db",                     desc: "Vacía la DB" },
        { method: "GET",    path: "/api/v1/help",                   desc: "Esta ayuda" }
      ]
    }
  })
};

/* ============================================================
   ROUTER
   ============================================================ */
function parseCommand(input) {
  input = input.trim();
  // soporta: GET /path, POST /path, o path simple
  const m = input.match(/^(GET|POST|PUT|DELETE|PATCH)\s+(\/.*)$/i);
  if (m) return { method: m[1].toUpperCase(), path: m[2] };
  if (input.startsWith("/")) return { method: "GET", path: input };
  return { method: "GET", path: "/" + input };
}

function matchRoute(method, path) {
  // path estilo /api/v1/datasets/privesc/load -> split por /
  const segs = path.split("/").filter(Boolean);
  if (segs[0] !== "api" || segs[1] !== "v1") return null;

  // /api/v1/help
  if (segs.length === 2 && segs[2] === "help") return { handler: 'GET /api/v1/help', params: [], query: {} };

  // /api/v1/db
  if (segs.length === 2 && segs[2] === "db") return { handler: `${method} /api/v1/db`, params: [], query: {} };

  // /api/v1/datasets
  if (segs.length === 2 && segs[2] === "datasets") return { handler: 'GET /api/v1/datasets', params: [], query: {} };

  // /api/v1/datasets/:name
  if (segs.length === 3 && segs[2] === "datasets") return { handler: 'GET /api/v1/datasets/', params: [segs[3]], query: {} };

  // /api/v1/datasets/:name/load
  if (segs.length === 4 && segs[2] === "datasets" && segs[4] === "load") {
    return { handler: 'POST /api/v1/datasets/', params: [segs[3], "load"], query: {} };
  }

  // /api/v1/commands
  if (segs.length === 2 && segs[2] === "commands") return { handler: 'GET /api/v1/commands', params: [], query: {} };

  // /api/v1/shells
  if (segs.length === 2 && segs[2] === "shells") return { handler: 'GET /api/v1/shells', params: [], query: {} };

  return null;
}

function handleRequest(method, path) {
  const [basePath, queryStr] = path.split("?");
  const query = {};
  if (queryStr) {
    queryStr.split("&").forEach(p => {
      const [k,v] = p.split("=");
      query[decodeURIComponent(k)] = decodeURIComponent(v || "");
    });
  }
  const route = matchRoute(method, basePath);
  if (!route) return { status: 404, data: { error: `Endpoint no encontrado: ${method} ${path}`, hint: "Probá GET /api/v1/help" } };
  const handler = MOCK_API[route.handler];
  if (!handler) return { status: 405, data: { error: `Método no permitido: ${method} ${basePath}` } };
  DB.queries.push({ method, path, ts: Date.now() });
  return handler(route.params, query);
}

/* ============================================================
   UI HELPERS
   ============================================================ */
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

function appendOutput(html, cls="info") {
  const out = $("#output");
  const line = document.createElement("div");
  line.className = "console-line " + cls;
  line.innerHTML = html;
  out.appendChild(line);
  out.scrollTop = out.scrollHeight;
}

function renderJSON(obj) {
  return `<pre style="color:var(--text);font-size:12px;white-space:pre-wrap">${JSON.stringify(obj, null, 2)}</pre>`;
}

function executeCommand(input) {
  const { method, path } = parseCommand(input);
  appendOutput(`<span class="verb">${method}</span> <span style="color:var(--text)">${path}</span>`, "req");
  try {
    const result = handleRequest(method, path);
    const statusCls = result.status < 400 ? "status" : "status err";
    appendOutput(`← <span class="${statusCls}">${result.status}</span> ${method} ${path.split("?")[0]}<br>${renderJSON(result.data)}`, result.status < 400 ? "res" : "err");
  } catch (e) {
    appendOutput(`✗ Error: ${e.message}`, "err");
  }
  updateDBStats();
}

function updateDBStats() {
  const stats = $("#dbStats");
  const loaded = Object.keys(DB.loaded);
  if (loaded.length === 0) {
    stats.innerHTML = `<div class="db-empty">// DB vacía</div>`;
    return;
  }
  const totalCmds = Object.values(DB.loaded).reduce((s,ds) => s + Object.values(ds.categories||{}).reduce((a,c)=>a+(c.commands||[]).length,0), 0);
  const totalCats = Object.values(DB.loaded).reduce((s,ds)=>s+Object.keys(ds.categories||{}).length,0);
  stats.innerHTML = `
    <div class="db-row"><span>Datasets:</span><span>${loaded.length}</span></div>
    <div class="db-row"><span>Categorías:</span><span>${totalCats}</span></div>
    <div class="db-row"><span>Comandos:</span><span>${totalCmds}</span></div>
    <div class="db-row"><span>Queries:</span><span>${DB.queries.length}</span></div>
  `;
}

/* ============================================================
   EVENTS
   ============================================================ */
window.runQuick = (cmd) => {
  executeCommand(cmd);
  $$(".tab").forEach(t => t.classList.remove("active"));
  $$(".tab[data-tab=console]").forEach(t => t.classList.add("active"));
  $(".console").scrollIntoView({ behavior: "smooth", block: "end" });
};

document.addEventListener("DOMContentLoaded", () => {
  // nav
  $$(".nav-item").forEach(item => {
    item.addEventListener("click", () => {
      $$(".nav-item").forEach(n => n.classList.remove("active"));
      item.classList.add("active");
      renderView(item.dataset.view);
    });
  });

  // tabs
  $$(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      $$(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
    });
  });

  // console input
  $("#cmd").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const v = $("#cmd").value.trim();
      if (!v) return;
      $("#cmd").value = "";
      executeCommand(v);
    }
  });

  renderView("home");
  updateDBStats();
});

window.closeModal = () => $("#modal").classList.remove("show");
